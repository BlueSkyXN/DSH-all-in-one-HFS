pid /tmp/dsh-nginx/nginx.pid;
worker_processes 1;

error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format dsh_hfs '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent"';
    access_log /dev/stdout dsh_hfs;
    server_tokens off;

    client_body_temp_path /tmp/dsh-nginx/client_body;
    proxy_temp_path /tmp/dsh-nginx/proxy;
    fastcgi_temp_path /tmp/dsh-nginx/fastcgi;
    uwsgi_temp_path /tmp/dsh-nginx/uwsgi;
    scgi_temp_path /tmp/dsh-nginx/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 7860;
        listen [::]:7860;

        client_max_body_size 64m;

        location = /healthz {
            auth_basic off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        location / {
            auth_basic "DeepSeek Harness";
            auth_basic_user_file /tmp/dsh-nginx/htpasswd;

            proxy_pass http://127.0.0.1:7861;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 127.0.0.1:7861;

        absolute_redirect off;
        include /tmp/dsh-nginx/launch-token.conf;

        client_max_body_size 64m;

        location @dsh_launch {
            return 302 "/?token=${dsh_launch_token}";
        }

        location = / {
            proxy_pass http://127.0.0.1:3080;
            proxy_intercept_errors on;
            error_page 401 = @dsh_launch;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:3080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
